<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Español Mexicano — Shortcuts</title>
<meta name="description" content="Rule-based shortcuts for Mexican Spanish, with spaced-repetition drills." />

<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#F7F5F1" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mexicano" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="boot"><div class="mark">Ñ</div><div>Cargando…</div></div>
<div id="root"></div>
<noscript style="display:block;padding:32px;font-size:15px;line-height:1.6;color:#1A2233">
  This app needs JavaScript. Enable it and reload.
</noscript>
<!-- Card decks. Plain scripts, in order, so the app also opens from disk. -->
<script src="./content/suffixes.js"></script>
<script src="./content/sound.js"></script>
<script src="./content/verbs.js"></script>
<script src="./content/tenses.js"></script>
<script src="./content/subjunctive.js"></script>
<script src="./content/gender.js"></script>
<script src="./content/mexicanismos.js"></script>
<script src="./content/connectors.js"></script>
<script src="./content/rules.js"></script>

<!-- The compiled app: React, the drill engine, and the sections. -->
<script src="./app.js"></script>
<script>
  // Clear the splash once React has painted something.
  (function () {
    var boot = document.getElementById("boot");
    var root = document.getElementById("root");
    function hide() { if (boot) boot.className = "gone"; }
    if (root.childNodes.length) { hide(); return; }
    var obs = new MutationObserver(function () { hide(); obs.disconnect(); });
    obs.observe(root, { childList: true });
    setTimeout(hide, 6000);
  })();
</script>
</body>
</html>
