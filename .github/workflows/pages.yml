name: Check and deploy

# Publishes the repo root as-is. There is no build step: the app is plain
# static files, so what is committed is what gets served. Deploys only happen
# on main; pull requests get the checks without the publish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scripts parse
        run: for f in app.js vendor/react.js content/*.js tools/*.js; do node --check "$f"; done

      - name: Every script and stylesheet is in the service worker shell
        run: |
          missing=0
          for f in styles.css app.js vendor/react.js content/*.js; do
            grep -q "\"\./$f\"" sw.js || { echo "not cached by sw.js: $f"; missing=1; }
          done
          exit $missing

      - name: Content
        run: node tools/check-content.js

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke
        run: node tools/smoke.js

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The dev tooling is not part of the app and should not be served.
      - name: Drop dev-only files
        run: rm -rf tools package.json package-lock.json node_modules

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
