name: Deploy to GitHub Pages

# Publishes the repo root as-is. There is no build step: the app is plain
# static files, so what is committed is what gets served.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts parse
        run: for f in app.js vendor/react.js content/*.js; do node --check "$f"; done

      - name: Check every script and stylesheet is in the service worker shell
        run: |
          missing=0
          for f in styles.css app.js vendor/react.js content/*.js; do
            grep -q "\"\./$f\"" sw.js || { echo "not cached by sw.js: $f"; missing=1; }
          done
          exit $missing

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
